[project]
name = "parallel-xai-gnn"
version = "0.2.0"
description = "Parallel XAI GNN"
authors = [
    {name = "Oscar Llorente Gonzalez", email = "oscar.llorente.gonzalez@ericsson.com"},
]
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "ipykernel==6.14.0",
    "matplotlib==3.9.1",
    "numpy==2.0.1",
    "openpyxl==3.1.5",
    "pandas==2.2.2",
    "pyarrow==17.0.0",
    "pyg-lib==0.4.0",
    "ruff==0.16.4",
    "scikit-learn==1.5.1",
    "scipy==1.14.1",
    "tensorboard==2.17.1",
    "torch-cluster==1.6.3",
    "torch-geometric==2.6.1",
    "torch-scatter==2.1.2",
    "torch-sparse==0.6.18",
    "torch-spline-conv==1.2.2",
    "torch==2.6.0",
    "torchmetrics==1.6.1",
    "tqdm==4.64.0",
    "ty==0.0.80",
    "uv-sort==0.7.1"
]

[tool.uv.sources]
pyg-lib = [
    { index = "pyg" },
]
torch = [
    { index = "torch" },
]
torch-cluster = [
    { index = "pyg" },
]
torch-scatter = [
    { index = "pyg" },
]
torch-sparse = [
    { index = "pyg" },
]
torch-spline-conv = [
    { index = "pyg" },
]

[[tool.uv.index]]
name = "torch"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pyg"
url = "https://data.pyg.org/whl/torch-2.6.0+cu124.html"
format = "flat"
explicit = true

[tool.ruff]
line-length = 88
exclude = [
    "*.ipynb",
    ".venv",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = ["F", "PL", "E", "D", "I", "W"]
ignore = ["D212", "D200", "D202", "D205", "PLR1711", "PLR0913", "PLR0917"]
extend-select = ["D213", "W505"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

[tool.ruff.lint.isort]
known-first-party = ["src"]
split-on-trailing-comma = true
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.isort.import-heading]
standard-library = "Standard libraries"
third-party = "3pps"
first-party = "Own modules"
local-folder = "Own modules"

[tool.ty.rules]
possibly-missing-submodule = "ignore"
